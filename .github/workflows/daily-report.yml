name: 更新汽车日报

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-report.yml'
  schedule:
    # timezone is Asia/Shanghai, so 8:17 means 08:17 in Shanghai, not UTC.
    # Minutes stay off :00 and :30. GitHub docs say schedule load peaks at the
    # start of every hour and jobs can be delayed or dropped.
    # 09:23 and 10:17 are retries if an earlier slot is delayed or dropped.
    - cron: '17 8 * * *'
      timezone: Asia/Shanghai
    - cron: '23 9 * * *'
      timezone: Asia/Shanghai
    - cron: '17 10 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PLAYWRIGHT_BROWSERS_PATH: 0
  # The scheduled report does not call OpenAI. Titles use local rules.
  # Search uses direct media lists, then Bing, plus official and government pages.
  # WEIBO_COOKIE is optional. An empty secret still publishes.
  WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}

concurrency:
  group: autopulse
  cancel-in-progress: false

jobs:
  collect-and-publish:
    # Runs are already on ubuntu-24.04 (image 20261012.334 through 2026-10-20).
    # Pin that image so a later ubuntu-latest move cannot change this job.
    runs-on: ubuntu-24.04
    # Recent successful runs finished in 16–26 minutes, almost all of it inside
    # article enrichment. The 30 minute cap cancelled that step before publish.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 启动云端无头浏览器
        run: |
          npm run start-cloud-browser > "$RUNNER_TEMP/cloud-browser.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3456/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/cloud-browser.log"
          exit 1

      - name: 采集、核验与生成日报
        run: npm run run-daily
        # Exits 0 when an official or government list was readable.
        # Weibo login walls and media misses are warnings.
        # Exits 1 only when a required step crashes or no core list was readable.

      - run: npm run validate-content

      - name: 保存本轮已核验的数据
        run: |
          git config user.name "automotive-daily-bot"
          git config user.email "automotive-daily-bot@users.noreply.github.com"
          git add runtime/*.json data/launch-calendar.json
          git diff --cached --quiet || (git commit -m "chore: update automotive daily report" && git push)

      - run: npm run prepare-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
